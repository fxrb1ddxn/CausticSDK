// Apply the Android application plugin (use 'com.android.library' if building a library)
//apply plugin: 'com.android.application'

android {
    compileSdkVersion 34 // Use the latest stable SDK version
    defaultConfig {
        applicationId "com.teotigraphix.causticsdk" // Adjust based on your package name
        minSdkVersion 21 // Caustic SDK typically supports API 21+
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        // Specify NDK version for native code
        ndkVersion "26.1.10909125" // Adjust based on Caustic SDK requirements
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', 'src-content'] // Include both src and src-content
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['libs'] // Include precompiled .so files if any
        }
    }

    // Configure NDK for native code compilation
 //   externalNativeBuild {
 //       ndkBuild {
  //          path 'src/jni/Android.mk' // Adjust if your JNI files are elsewhere
  //      }
  //  }
// }

dependencies {
    // Include .jar files in libs/ and libs-ext/
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation fileTree(dir: 'libs-ext', include: ['*.jar'])
    // Add Android support libraries if needed
    implementation 'androidx.core:core:1.13.1'
    // Add other dependencies as required by Caustic SDK
}
