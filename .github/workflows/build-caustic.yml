name: Build Caustic SDK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: 'yes'

      # Step 4: Install Android NDK
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125" # Match the NDK version in build.gradle
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # Step 5: Grant execute permission to Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Step 6: Build the project
      - name: Build Caustic SDK
        run: ./gradlew assembleDebug # Use assembleRelease for signed builds

      # Step 7: Upload build artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: caustic-sdk-apk
          path: build/outputs/apk/debug/*.apk # Adjust if building a library (.aar)
